{% extends "base.html" %}
{% block content %}

<div class="auth-page">
  <div class="auth-card">
    <h3>Reset Password</h3>
    <p>Enter your username email (if provided)</p>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="auth-btn">Send Reset Link</button>
    </form>
  </div>
</div>

{% endblock %}
