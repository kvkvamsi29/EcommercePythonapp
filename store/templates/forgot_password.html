{% extends "base.html" %}
{% block content %}

<div class="auth-page">
  <div class="auth-card">

    <div class="auth-intro">
      <h2>Forgot Password 🔐</h2>
      <p>Enter your registered email address.</p>
    </div>

    {% if error %}
      <div class="alert alert-danger">
        {{ error }}
      </div>
    {% endif %}

    <form method="post" onsubmit="showPageLoader();class="auth-form" id="forgotPasswordForm">
      {% csrf_token %}

      <div class="form-group">
        <label>Email Address</label>

        <input
          type="email"
          name="email"
          class="form-control"
          required
          autocomplete="email"
          placeholder="Enter your registered email"
        >
      </div>

      <button
        type="submit"
        class="auth-btn"
        id="sendOtpButton"
      >
        <span id="sendOtpText">Send OTP</span>
        <span id="sendOtpLoader" style="display: none;">
          Sending OTP...
        </span>
      </button>

    </form>

    <div class="auth-footer">
      Remembered your password?
      <a href="{% url 'login' %}">Login</a>
    </div>

  </div>
</div>

<script>
document.getElementById("forgotPasswordForm").addEventListener("submit", function () {

    const button = document.getElementById("sendOtpButton");
    const normalText = document.getElementById("sendOtpText");
    const loadingText = document.getElementById("sendOtpLoader");

    // Prevent another click.
    button.disabled = true;

    // Change button text.
    normalText.style.display = "none";
    loadingText.style.display = "inline";

});
</script>

{% endblock %}
