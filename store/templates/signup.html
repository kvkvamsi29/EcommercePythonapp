{% extends "base.html" %}
{% block content %}

<div class="auth-page">
  <div class="auth-card">

    <div class="auth-intro">
      <h2>Create Account ✨</h2>
      <p>Username, email and password are required</p>
    </div>

    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="post" onsubmit="showPageLoader();" class="auth-form">
      {% csrf_token %}

      <div class="form-group">
        <label>Username</label>
        <input
          type="text"
          name="username"
          class="form-control"
          value="{{ username|default:'' }}"
          required
          autocomplete="username"
        >
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input
          type="email"
          name="email"
          class="form-control"
          value="{{ email|default:'' }}"
          required
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          name="password"
          class="form-control"
          required
          autocomplete="new-password"
        >
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input
          type="password"
          name="confirm_password"
          class="form-control"
          required
          autocomplete="new-password"
        >
      </div>

      <button type="submit" class="auth-btn">
        Create Account
      </button>

    </form>

    <div class="auth-footer">
      Already have an account?
      <a href="{% url 'login' %}">Login</a>
    </div>

  </div>
</div>

{% endblock %}
